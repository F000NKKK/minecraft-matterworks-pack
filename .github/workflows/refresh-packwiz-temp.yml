name: Temporary final Packwiz refresh

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.number == 13 && github.event.pull_request.head.ref == 'feature/0.5.7-industrial-process-expansion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.5.7-industrial-process-expansion
          fetch-depth: 0
      - name: Refresh hashes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re
          root = Path('.')
          index_path = root / 'index.toml'
          text = index_path.read_text(encoding='utf-8')
          block_re = re.compile(r'(\[\[files\]\]\nfile = "([^"]+)"\nhash = ")([0-9a-f]+)("(?:\nmetafile = (?:true|false))?)', re.MULTILINE)
          def repl(m):
              path = root / m.group(2)
              if not path.is_file():
                  raise SystemExit(f'Indexed file missing: {m.group(2)}')
              return m.group(1) + hashlib.sha256(path.read_bytes()).hexdigest() + m.group(4)
          text = block_re.sub(repl, text)
          index_path.write_text(text, encoding='utf-8')
          digest = hashlib.sha256(index_path.read_bytes()).hexdigest()
          pack_path = root / 'pack.toml'
          pack = pack_path.read_text(encoding='utf-8')
          pack, n = re.subn(r'(\[index\]\nfile = "index\.toml"\nhash-format = "sha256"\nhash = ")[0-9a-f]+(")', lambda m: m.group(1)+digest+m.group(2), pack, count=1)
          if n != 1: raise SystemExit('pack.toml index hash not found')
          pack_path.write_text(pack, encoding='utf-8')
          print('index sha256=' + digest)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.toml pack.toml
          git diff --cached --quiet && exit 0
          git commit -m 'chore: finalize packwiz hashes'
          git push origin HEAD:feature/0.5.7-industrial-process-expansion
