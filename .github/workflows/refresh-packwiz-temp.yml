name: Temporary complete Packwiz refresh

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.number == 13 && github.event.pull_request.head.ref == 'feature/0.5.7-industrial-process-expansion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.5.7-industrial-process-expansion
          fetch-depth: 0

      - name: Refresh index coverage and hashes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          root = Path('.')
          index_path = root / 'index.toml'
          text = index_path.read_text(encoding='utf-8')

          block_re = re.compile(
              r'\[\[files\]\]\nfile = "([^"]+)"\nhash = "([0-9a-f]+)"(?:\nmetafile = (true|false))?',
              re.MULTILINE,
          )
          matches = list(block_re.finditer(text))
          existing = {m.group(1) for m in matches}

          expected = set()
          quests = root / 'config' / 'ftbquests' / 'quests'
          if quests.is_dir():
              expected.update(p.relative_to(root).as_posix() for p in quests.rglob('*.snbt') if p.is_file())
          kubejs = root / 'kubejs'
          if kubejs.is_dir():
              expected.update(p.relative_to(root).as_posix() for p in kubejs.rglob('*') if p.is_file())
          mods = root / 'mods'
          if mods.is_dir():
              expected.update(p.relative_to(root).as_posix() for p in mods.glob('*.pw.toml') if p.is_file())

          missing = sorted(expected - existing)
          if missing:
              suffix = '' if text.endswith('\n') else '\n'
              blocks = []
              for rel in missing:
                  digest = hashlib.sha256((root / rel).read_bytes()).hexdigest()
                  block = f'[[files]]\nfile = "{rel}"\nhash = "{digest}"'
                  if rel.startswith('mods/') and rel.endswith('.pw.toml'):
                      block += '\nmetafile = true'
                  blocks.append(block)
              text = text + suffix + '\n' + '\n\n'.join(blocks) + '\n'
              print('Added missing index entries:')
              for rel in missing:
                  print('  ' + rel)

          def refresh(match):
              rel = match.group(1)
              path = root / rel
              if not path.is_file():
                  raise SystemExit(f'Indexed file missing: {rel}')
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              metafile = match.group(3)
              block = f'[[files]]\nfile = "{rel}"\nhash = "{digest}"'
              if metafile is not None:
                  block += f'\nmetafile = {metafile}'
              return block

          text = block_re.sub(refresh, text)
          index_path.write_text(text, encoding='utf-8')

          index_hash = hashlib.sha256(index_path.read_bytes()).hexdigest()
          pack_path = root / 'pack.toml'
          pack = pack_path.read_text(encoding='utf-8')
          pack, count = re.subn(
              r'(\[index\]\nfile = "index\.toml"\nhash-format = "sha256"\nhash = ")[0-9a-f]+(")',
              lambda m: m.group(1) + index_hash + m.group(2),
              pack,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not update [index] hash in pack.toml')
          pack_path.write_text(pack, encoding='utf-8')
          print(f'Index entries: {len(existing) + len(missing)}; index sha256={index_hash}')
          PY

      - name: Commit refreshed Packwiz state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.toml pack.toml
          if git diff --cached --quiet; then
            echo 'Packwiz state already current.'
            exit 0
          fi
          git commit -m 'chore: refresh packwiz hashes and coverage'
          git push origin HEAD:feature/0.5.7-industrial-process-expansion
