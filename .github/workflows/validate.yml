name: Validate Matterworks pack

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Static pack validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Packwiz index and KubeJS invariants
        run: |
          sha256sum \
            config/ftbquests/quests/chapters/age_1_industrial.snbt \
            config/ftbquests/quests/chapters/guide_create.snbt \
            kubejs/server_scripts/matterworks/progression/research.js \
            kubejs/server_scripts/matterworks/recipes/advantage_equipment.js \
            index.toml
          python3 .github/scripts/validate-pack.py
