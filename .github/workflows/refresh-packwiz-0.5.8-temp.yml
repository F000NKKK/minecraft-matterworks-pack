name: Refresh Packwiz 0.5.8 temporary

on:
  pull_request:
    branches:
      - main
    types:
      - reopened

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.ref == 'feature/0.5.8-process-realism'
    runs-on: ubuntu-latest
    steps:
      - name: Check out 0.5.8 branch
        uses: actions/checkout@v6
        with:
          ref: feature/0.5.8-process-realism
          fetch-depth: 0

      - name: Install Packwiz
        run: |
          go install github.com/packwiz/packwiz@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Refresh local-file index
        run: packwiz refresh

      - name: Commit refreshed Packwiz metadata
        run: |
          if git diff --quiet -- index.toml pack.toml; then
            echo "Packwiz metadata already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.toml pack.toml
          git commit -m "chore: refresh Packwiz for 0.5.8"
          git push origin HEAD:feature/0.5.8-process-realism
