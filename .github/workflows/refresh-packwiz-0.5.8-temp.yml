name: Refresh Packwiz 0.5.8 temporary

on:
  pull_request:
    branches:
      - main
    types:
      - reopened

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.ref == 'feature/0.5.8-process-realism'
    runs-on: ubuntu-latest
    steps:
      - name: Check out 0.5.8 branch
        uses: actions/checkout@v6
        with:
          ref: feature/0.5.8-process-realism
          fetch-depth: 0

      - name: Route reconstruction through specialty chemistry
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('config/ftbquests/quests/chapters/age_1_industrial.snbt')
          text = path.read_text(encoding='utf-8')

          old_specialty = 'dependencies: ["2130000000000005", "2130000000000012"], hide_dependency_lines: false, id: "2130000000000023", title: "Specialty Industrial Chemistry"'
          new_specialty = 'dependencies: ["2130000000000005", "2130000000000012", "2120000000000007"], hide_dependency_lines: false, id: "2130000000000023", title: "Specialty Industrial Chemistry"'

          old_final = 'dependencies: ["2130000000000024", "2130000000000008", "2130000000000006", "2120000000000007"], hide_dependency_lines: false, id: "2130000000000007", title: "Industrial Age Established"'
          new_final = 'dependencies: ["2130000000000024", "2130000000000008", "2130000000000006"], hide_dependency_lines: false, id: "2130000000000007", title: "Industrial Age Established"'

          if old_specialty in text:
              text = text.replace(old_specialty, new_specialty, 1)
          elif new_specialty not in text:
              raise SystemExit('specialty chemistry quest fragment not found')

          if old_final in text:
              text = text.replace(old_final, new_final, 1)
          elif new_final not in text:
              raise SystemExit('Industrial Age final quest fragment not found')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate patched quest geometry
        run: python3 .github/scripts/validate-quest-layout.py

      - name: Install Packwiz
        run: |
          go install github.com/packwiz/packwiz@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Refresh local-file index
        run: packwiz refresh

      - name: Commit patch and refreshed Packwiz metadata
        run: |
          if git diff --quiet; then
            echo "Quest and Packwiz metadata already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/ftbquests/quests/chapters/age_1_industrial.snbt index.toml pack.toml
          git commit -m "fix: route reconstruction through specialty chemistry"
          git push origin HEAD:feature/0.5.8-process-realism
