name: Refresh Packwiz 0.5.9 temporary

on:
  push:
    branches:
      - feature/0.5.9-specialist-materials

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out 0.5.9 branch
        uses: actions/checkout@v6
        with:
          ref: feature/0.5.9-specialist-materials
          fetch-depth: 0

      - name: Install Packwiz
        run: |
          go install github.com/packwiz/packwiz@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Refresh local-file index
        run: packwiz refresh

      - name: Commit refreshed Packwiz metadata
        run: |
          if git diff --quiet; then
            echo "Packwiz metadata already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.toml pack.toml
          git commit -m "chore: refresh 0.5.9 Packwiz hashes after specialist policy"
          git push origin HEAD:feature/0.5.9-specialist-materials
