name: Apply 0.5.8 quest patch

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/0.5.8-process-realism
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/0.5.8-process-realism

      - name: Patch Industrial Age process causality
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('config/ftbquests/quests/chapters/age_1_industrial.snbt')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'dependencies: ["2110000000000008", "2110000000000003", "2110000000000002"], hide_dependency_lines: false, id: "2110000000000004", title: "Mechanical Power Generation", description: ["Construct the Matterworks alternator after establishing coils, control components and industrial carbon processing. The factory can now convert kinetic work into controlled electrical power without skipping the mechanical foundation."]':
              'dependencies: ["2110000000000008", "2110000000000003"], hide_dependency_lines: false, id: "2110000000000004", title: "Mechanical Power Generation", description: ["Construct the Matterworks alternator after establishing coils and control components. Electrical generation now follows from electromechanical manufacturing directly; coke processing remains a separate prerequisite for later metallurgy rather than an artificial alternator dependency."]',

              'dependencies: ["2120000000000007"], hide_dependency_lines: false, id: "2130000000000001", title: "Controlled Metallurgy", description: ["Build the Matterworks-gated Metallurgic Infuser. This is the first controlled electrical metallurgy platform and remains rooted in the mechanical production line that created its control hardware."]':
              'dependencies: ["2110000000000004", "2110000000000002"], hide_dependency_lines: false, id: "2130000000000001", title: "Controlled Metallurgy", description: ["Build the Matterworks-gated Metallurgic Infuser after electrical generation and deliberate carbon processing exist. Metallurgy is a physical production discipline parallel to chemical reconstruction; owning a Combiner is no longer treated as a prerequisite for alloy processing."]',

              'dependencies: ["2130000000000013"], hide_dependency_lines: false, id: "2130000000000006", title: "Engineered Carbon Production", description: ["Use the electrical furnace to graphitize coke and produce graphite. Graphite is now a real process output and becomes the electrode feed for the first industrial electrolysis stack."]':
              'dependencies: ["2130000000000013", "2130000000000010"], hide_dependency_lines: false, id: "2130000000000006", title: "Engineered Carbon Production", description: ["Graphitize coke in a dedicated high-temperature thermopneumatic process after both electrical heating and mature pressure/thermal infrastructure exist. Graphite becomes a real engineered-carbon output and the electrode feed for the first industrial electrolysis stack."]',

              'dependencies: ["2130000000000010"], hide_dependency_lines: false, id: "2130000000000021", title: "Petrochemical Fractionation", description: ["Build a refinery and demonstrate useful hydrocarbon fractions. Crude oil is a process stream, not a universal fuel item; fractionation creates the feedstocks used by later industrial chemistry."]':
              'dependencies: ["2130000000000010", "2130000000000013"], hide_dependency_lines: false, id: "2130000000000021", title: "Petrochemical Fractionation", description: ["Build a refinery only after fluid/pressure infrastructure and controlled process heat both exist. Fractionation is driven by heating, vaporisation and condensation; PneumaticCraft supplies the plant implementation, not the physical explanation for separation."]',

              'dependencies: ["2130000000000021", "2130000000000014"], hide_dependency_lines: false, id: "2130000000000022", title: "Renewable Organic Processing", description: ["Close the first renewable fuel loop by producing biodiesel through PneumaticCraft processing. Renewable organics are a distinct process family rather than free substitutes for refinery products."]':
              'dependencies: ["2130000000000014", "2130000000000010"], hide_dependency_lines: false, id: "2130000000000022", title: "Renewable Organic Processing", description: ["Close the first renewable fuel loop by producing biodiesel through PneumaticCraft processing. This branch is independent of petroleum fractionation: renewable oil/fuel processing shares plant hardware but does not require crude-oil refining as a parent technology."]',

              'dependencies: ["2130000000000014"], hide_dependency_lines: false, id: "2130000000000015", title: "Polymer Feedstock", description: ["Run the first PRC stage with water, hydrogen and biofuel. It produces substrate and chemical ethene; both outputs matter to the next stage."]':
              'dependencies: ["2130000000000014"], hide_dependency_lines: false, id: "2130000000000015", title: "Polymer Substrate", description: ["Condition biomass in the PRC with water and hydrogen to produce the solid substrate seed. The 0.5.7 shortcut that also created ethene here is removed: polymer monomer production now belongs to the petrochemical branch."]',

              'dependencies: ["2130000000000015"], hide_dependency_lines: false, id: "2130000000000016", title: "Ethene Phase Conversion", description: ["The first PRC outputs ethene as a Mekanism chemical, while HDPE polymerization consumes liquid ethene. Build a Rotary Condensentrator and convert the chemical stream into its fluid phase."], x: -2.0d, y: 51.0d, shape: "square", tasks: [{ id: "3130000000000017", item: "mekanism:rotary_condensentrator", type: "item" }]':
              'dependencies: ["2130000000000021"], hide_dependency_lines: false, id: "2130000000000016", title: "Cracked Ethylene Handling", description: ["Crack the refinery light fraction into ethylene in the Thermopneumatic Processing Plant, then establish phase/interface handling with a Rotary Condensentrator. Polymer feedstock now comes from an explicit hydrocarbon conversion step rather than appearing as a PRC by-product."], x: -2.0d, y: 51.0d, shape: "square", tasks: [{ id: "3130000000000017", item: "mekanism:rotary_condensentrator", type: "item" } { id: "3130000000000034", item: "chemlib:ethylene", count: 4, type: "item" }]',

              'dependencies: ["2130000000000016"], hide_dependency_lines: false, id: "2130000000000011", title: "Polymer Engineering", description: ["Feed substrate, liquid ethene and oxygen into the PRC to produce HDPE pellets. The quest follows the actual Mekanism process chain end to end."]':
              'dependencies: ["2130000000000015", "2130000000000016"], hide_dependency_lines: false, id: "2130000000000011", title: "Polymer Engineering", description: ["Combine the independently prepared substrate with refinery-derived liquid ethylene and oxygen in the PRC to produce HDPE pellets. Polymerisation now converges biomass conditioning, petrochemical monomer production and reaction chemistry instead of treating one machine recipe as the whole process."]',

              'dependencies: ["2130000000000020", "2130000000000021", "2130000000000022", "2130000000000023", "2130000000000011", "2130000000000012"], hide_dependency_lines: false, id: "2130000000000024", title: "Industrial Process Integration"':
              'dependencies: ["2130000000000020", "2130000000000021", "2130000000000022", "2130000000000023", "2130000000000011", "2130000000000012", "2130000000000025"], hide_dependency_lines: false, id: "2130000000000024", title: "Industrial Process Integration"',

              'dependencies: ["2130000000000024", "2130000000000008", "2130000000000006"], hide_dependency_lines: false, id: "2130000000000007", title: "Industrial Age Established"':
              'dependencies: ["2130000000000024", "2130000000000008", "2130000000000006", "2120000000000007"], hide_dependency_lines: false, id: "2130000000000007", title: "Industrial Age Established"',
          }

          changed = False
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True
              elif new not in text:
                  raise SystemExit(f'expected quest fragment not found: {old[:120]}')

          ammonia = '\t\t{ dependencies: ["2130000000000005", "2130000000000012"], hide_dependency_lines: false, id: "2130000000000025", title: "Ammonia Synthesis", description: ["Combine atmospheric nitrogen with electrolytic hydrogen under pressure using an iron catalyst. This is the first process where gas separation, electrolysis and pressure engineering converge into one chemically defined synthesis loop."], x: 5.5d, y: 51.0d, shape: "diamond", size: 1.2d, tasks: [{ id: "3130000000000035", item: "chemlib:ammonia", count: 8, type: "item" }], rewards: [{ id: "6130000000000025", type: "xp", xp: 325 }] }\n'
          anchor = '\t\t{ dependencies: ["2130000000000015", "2130000000000016"], hide_dependency_lines: false, id: "2130000000000011", title: "Polymer Engineering"'
          if 'id: "2130000000000025"' not in text:
              pos = text.find(anchor)
              if pos < 0:
                  raise SystemExit('polymer integration anchor not found')
              text = text[:pos] + ammonia + text[pos:]
              changed = True

          if changed:
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate quest graph and duplicate IDs
        run: |
          python3 .github/scripts/validate-quest-layout.py
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('config/ftbquests/quests/chapters/age_1_industrial.snbt')
          ids = re.findall(r'\bid:\s*"(\d{16})"', p.read_text(encoding='utf-8'))
          dup = sorted({x for x in ids if ids.count(x) > 1})
          if dup:
              raise SystemExit('duplicate IDs: ' + ', '.join(dup))
          PY

      - name: Commit patch when needed
        run: |
          if git diff --quiet; then
            echo "Quest patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/ftbquests/quests/chapters/age_1_industrial.snbt
          git commit -m "refactor: align Industrial Age with physical process causality"
          git push origin HEAD:feature/0.5.8-process-realism
